global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'minicloud-master'
    static_configs:
      - targets: ['host.docker.internal:8000', '192.168.1.10:8000']

  - job_name: 'minicloud-workers'
    static_configs:
      - targets: [
          'host.docker.internal:8001',
          '192.168.1.11:8001',
          '192.168.1.12:8001',
          '192.168.1.13:8001'
        ]
